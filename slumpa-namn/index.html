<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slumpa namn – dra ett eller flera namn | Randomisera.se</title>
<meta name="description" content="Slumpa namn ur en egen lista. Dra en vinnare eller flera namn utan upprepning och kopiera resultatet. Gratis och utan inloggning.">
<link rel="canonical" href="https://randomisera.se/slumpa-namn/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFCFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191F1B" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-mode="names">
<a class="skip" href="#main">Hoppa till innehållet</a>
<main id="main">
<nav aria-label="Verktyg" id="tools"><a href="../slumpa-namn/" aria-current="page">Namn</a><a href="../slumpa-nummer/">Nummer</a><a href="../dela-in-i-grupper/">Grupper</a><a href="../slumpa-lista/">Lista</a><a href="../singla-slant/">Slant</a></nav>
<h1>Slumpa namn – dra ett eller flera namn</h1>
<div class="workspace">
<form id="form" aria-labelledby="title" aria-describedby="help">
<h2 id="title" class="sr-only">Slumpa namn</h2><p class="help" id="help">Skriv ett namn per rad. Dra ett eller flera åt gången.</p>
<div id="listFields"><label for="entries" id="listLabel">Namn, ett per rad</label><textarea id="entries" placeholder="Alex&#10;Kim&#10;Sam&#10;Robin" maxlength="100000"></textarea></div>
<div id="numberFields" hidden><div class="row"><div><label for="min">Från</label><input id="min" type="number" value="1" min="-1000000000" max="1000000000" required></div><div><label for="max">Till</label><input id="max" type="number" value="100" min="-1000000000" max="1000000000" required></div></div></div>
<div id="countFields"><label for="count" id="countLabel">Antal namn att dra</label><input id="count" type="number" min="1" max="1000" value="1" required></div>
<label class="check" id="uniqueLabel"><input id="unique" type="checkbox" checked>Utan upprepningar</label>
<label class="check" id="removeDuplicatesLabel"><input type="checkbox" id="dedupe" checked>Ta bort identiska rader</label>

<div id="decisionFields" hidden><label for="decision">Välj typ</label><select id="decision"><option value="coin">Singla slant</option><option value="yes">Ja eller nej</option><option value="dice">Kasta en tärning</option></select></div>
<p id="error" class="error" role="alert" hidden></p>
<button type="submit" class="primary" id="submit">Slumpa namn</button>

</form>
<section class="result" aria-labelledby="result-title"><div class="result-head"><h2 id="result-title">Ditt resultat</h2><button id="copy" class="secondary" disabled>Kopiera</button></div><div id="output" aria-live="polite" aria-atomic="true"><p class="empty">Här dyker resultatet upp.</p></div><div class="result-foot"><p class="note" id="status">Redo när du är.</p><button type="button" id="reset" class="secondary">Återställ dragningen</button></div></section>
</div>
<noscript><p>Aktivera JavaScript för att använda verktyget.</p></noscript></main><footer><a class="site-name" href="../">randomisera.se</a><p>Allt slumpas i din webbläsare.</p></footer>
<script src="../assets/app.js" defer></script>
</body>
</html>
